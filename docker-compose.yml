services:
  api:
    build: .
    container_name: custom-tools-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    container_name: custom-tools-worker
    command: ["python", "-m", "app.worker.run_worker"]
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: custom-tools-redis
    restart: unless-stopped
